[build-system]
requires = ["setuptools==80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "government-ocr-text-api"
version = "1.3.5.9"
description = "Hybrid PDF-to-text API: pdf-inspector + PP-OCRv6 detector + VietOCR"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["runtime", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
